# Serves the SPA and proxies /api to the API on the same origin (cookies, no CORS in production).
# TLS terminates at the gateway (phase 8); HSTS is added there.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (RS-08) are set per location below: nginx only inherits server-level add_header
    # when a location has none of its own, and /api must keep the stricter policy sent by the API.
    # 'unsafe-inline' for styles only: sonner injects a <style> element at runtime; scripts stay 'self'.
    # Revisit with a nonce if the toast library changes.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-running AI calls must not be cut by a fixed proxy timeout (HR18/HR19):
        # the job watchdog in the API owns time limits.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths get the shell, which renders its own 404 page.
    location / {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri /index.html;
    }
}
